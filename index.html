<!DOCTYPE html>
<html lang="pt-br"> 

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus objetivos do ano</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="conteudo-principal">
    <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>
    <div class="botoes">
      <button class="botao ativo">Passar no vestibular</button>
      <button class="botao">Estudar francês</button>
      <button class="botao">Aproveitar as férias</button>
      <button class="botao">Halloween</button>
    </div>
  </section>

  <section class="abas-textos">
    <div class="aba-conteudo">
      <h3 class="aba-conteudo-titulo-principal">Focar em português e biologia</h3>
      <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
    </div>
    <div class="aba-conteudo">
      <h3 class="aba-conteudo-titulo-principal">Assistir aulas</h3>
      <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
    </div>
    <div class="aba-conteudo">
      <h3 class="aba-conteudo-titulo-principal">Adiantar os estudos e sair com a Erika</h3>
      <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
    </div>
    <div class="aba-conteudo">
      <h3 class="aba-conteudo-titulo-principal">Me fantasiar junto com alguém</h3>
      <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
    </div>
  </section>

  <script>
    const botoes = document.querySelectorAll('.botao');
    const abas = document.querySelectorAll('.aba-conteudo');

    function mostraAba(index) {
      for (let k = 0; k < abas.length; k++) {
        abas[k].style.display = k === index ? 'block' : 'none';
      }
    }

    for (let i = 0; i < botoes.length; i++) {
      botoes[i].addEventListener('click', function () {
        for (let j = 0; j < botoes.length; j++) {
          botoes[j].classList.remove('ativo');
        }
        botoes[i].classList.add('ativo');
        mostraAba(i);
      });
    }

    // mostra somente a primeira aba inicialmente
    mostraAba(0);
  </script>

  <script src="main.js"></script>
</body>

</html>
