<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relato: Hora do Desafio</title>
    <style>
        /* Variáveis de cores para um visual limpo e relaxante */
        :root {
            --bg-color: #FAFAFA;
            --paper-color: #FFFFFF;
            --text-main: #333333;
            --text-light: #888888;
            --accent: #2E88FF; /* Azul suave */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .journal-container {
            background-color: var(--paper-color);
            max-width: 700px;
            width: 100%;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .metadata {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #EEE;
            padding-bottom: 15px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .tag {
            background-color: #F0F4F8;
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-top: 0;
            margin-bottom: 30px;
            color: #111;
            letter-spacing: -0.5px;
        }

      
        p {
            font-size: 1.15rem;
            margin-bottom: 25px;
            color: #444;
        }
        @media (max-width: 600px) {
            .journal-container {
                padding: 30px 20px;
                margin-top: 0;
                border-radius: 0;
                box-shadow: none;
            }
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1.05rem;
            }
        }

        code {
            color: blueviolet;
            background-color: #f0f4f8;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <main class="journal-container">
        
        <div class="metadata">
            <span class="date">4 de Maio de 2026</span>
            <span class="tag">Hora do Desafio 2</span>
        </div>

  
        <h1>O que eu achei do desafio de Lógica de Programação</h1>

      
        <p>
            Eu realizei o desafio proposto pelo alura na Hora do Desafio 2
        </p>

        <p>
            Tudo que tive que fazer foi adicionar no <cite>style.css</cite> na sessão <code>.ativo</code> a propriedade <code>font-weight: bolder;</code> e criei uma <code>var</code> com a cor nova.
        </p>

    </main>

</body>
</html>
